# Development: Elixir app with bind mounts for hot-reload + Vite HMR.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d

services:
  otel-collector:
    environment:
      OTEL_COLLECTOR_BATCH_TIMEOUT: 250ms

  alloy:
    environment:
      ALLOY_LOG_POLL_FREQUENCY: 100ms

  network_defense:
    build:
      context: ../src
      dockerfile: Dockerfile.dev
    image: network_defense:dev
    container_name: network-defense-app
    env_file: ../src/.env
    environment:
      MIX_BUILD_PATH: /app/_build_docker
      REPO_HOSTNAME: ${REPO_HOSTNAME:-postgres}
      REPO_PORT: ${REPO_PORT:-5432}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_IP: ${PHX_IP:-0.0.0.0}
      PORT: ${PORT:-4000}
      NPM_CONFIG_NODE_OPTIONS: ${NPM_CONFIG_NODE_OPTIONS:---inspect=0.0.0.0:9229}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-network_defense}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/network_defense/network_defense.jsonl}
      LOG_FILE_LEVEL: ${LOG_FILE_LEVEL:-debug}
    stdin_open: true
    tty: true
    ports:
      - "4000:4000"
      - "4001:4001"
      - "5173:5173"
      - "9229:9229"
    volumes:
      - network-defense-logs:/var/log/network_defense
      - ../src/lib:/app/lib
      - ../src/priv:/app/priv
      - ../src/test:/app/test
      - ../src/config:/app/config
      - ../src/assets/js:/app/assets/js
      - ../src/assets/css:/app/assets/css
      - ../src/assets/svelte:/app/assets/svelte
      - ../src/assets/vendor:/app/assets/vendor
      - ../src/assets/vite.config.mjs:/app/assets/vite.config.mjs
      # Generated build artifacts stay in Docker volumes so root inside the
      # development container cannot change ownership of host directories.
      - network-defense-build:/app/_build_docker
      - network-defense-deps:/app/deps
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  network-defense-build:
  network-defense-deps:
