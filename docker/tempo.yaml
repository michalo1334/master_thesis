# Tempo configuration for the attack-graph thesis.
# Minimal: in-memory + local filesystem storage, single binary, all components in-process.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    pool:
      max_workers: 100

# No querier / frontend_worker block — single-binary Tempo runs them in-process.
# If you switch to microservices mode, restore the querier config.
