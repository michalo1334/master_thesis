# Prometheus configuration for the attack-graph thesis.
# Scrapes the OTel Collector's Prometheus exporter for app metrics.
# Retention: 7 days (set in docker-compose command line).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: network_defense

scrape_configs:
  - job_name: elixir-app
    static_configs:
      - targets: ["network_defense:4001"]
        labels:
          component: app

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: self
