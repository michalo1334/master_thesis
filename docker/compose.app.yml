# Application contract. Environment-specific files provide the image, secrets,
# dependencies, and host-port policy.
services:
  network_defense:
    image: network_defense
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
