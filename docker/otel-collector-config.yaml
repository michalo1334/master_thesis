# OTel Collector configuration for the attack-graph thesis.
#
# Receives traces and metrics from the Elixir app via OTLP, exports traces
# to Tempo and metrics to Prometheus. Application logs are shipped to Loki
# by Grafana Alloy (see docker/alloy-config.alloy), not by this collector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: ${env:OTEL_COLLECTOR_BATCH_TIMEOUT:-5s}
    send_batch_size: 1000

  # Resource attributes common to everything this app emits.
  resource:
    attributes:
      - key: service.name
        value: network_defense
        action: insert

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  # Traces to Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true

  # Metrics to Prometheus (collector-served, scraped by Prometheus)
  prometheus:
    endpoint: 0.0.0.0:8889
    const_labels:
      service: network_defense

  # Debug exporter for development
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

  extensions: []
  telemetry:
    metrics:
      address: 0.0.0.0:8888
