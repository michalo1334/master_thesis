# Promtail tails the Elixir app container's stdout (Docker json-file log)
# and pushes to Loki. logger_json emits one JSON object per log line.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["network-defense-app"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - target_label: job
        replacement: network_defense
      - target_label: app
        replacement: network_defense
      - target_label: service_name
        replacement: network_defense
    pipeline_stages:
      - json:
          expressions:
            level: severity
            trace_id: trace
            span_id: span
            request_id: metadata.request_id
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          level:
      - structured_metadata:
          trace_id:
          span_id:
          request_id:
