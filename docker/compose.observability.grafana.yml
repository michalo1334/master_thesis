# Grafana observability adapter. The application only sends OTLP to the
# collector and writes an optional structured log file.
services:
  network_defense:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FILE_PATH: /var/log/network_defense/network_defense.jsonl
    volumes:
      - network-defense-logs:/var/log/network_defense

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - prometheus

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  postgres-exporter-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
    command: ["/bin/sh", "/usr/local/bin/postgres-exporter-init.sh"]
    volumes:
      - ./postgres-exporter-init.sh:/usr/local/bin/postgres-exporter-init.sh:ro
    secrets:
      - source: postgres-password
        target: postgres-password
      - source: postgres-exporter-password
        target: postgres-exporter-password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres-exporter-password
    command:
      - --collector.long_running_transactions
      - --config.file=/etc/postgres-exporter/postgres-exporter.yaml
    volumes:
      - ./postgres-exporter.yaml:/etc/postgres-exporter/postgres-exporter.yaml:ro
    secrets:
      - source: postgres-exporter-password
        target: postgres-exporter-password
    depends_on:
      postgres-exporter-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.3.2
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.17.1
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy"
      ]
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - network-defense-logs:/var/log/network_defense:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - tempo
      - prometheus
      - loki
      - alloy

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  network-defense-logs:
