# Private demo deployment. Supply all secrets as restrictive host files.
services:
  network_defense:
    image: ${APP_IMAGE:?set APP_IMAGE to an immutable image tag or digest}
    environment: &app_environment
      DATABASE_URL_FILE: /run/secrets/database-url
      SECRET_KEY_BASE_FILE: /run/secrets/secret-key-base
      LIVE_VIEW_SIGNING_SALT_FILE: /run/secrets/live-view-signing-salt
      PHX_HOST: ${PHX_HOST:?set PHX_HOST}
      PORT: "4000"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-network_defense}
      ECTO_IPV6: ${ECTO_IPV6:-true}
    secrets: &app_secrets
      - source: database-url
        target: database-url
      - source: secret-key-base
        target: secret-key-base
      - source: live-view-signing-salt
        target: live-view-signing-salt
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      network_defense_migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  network_defense_migrate:
    image: ${APP_IMAGE:?set APP_IMAGE to an immutable image tag or digest}
    command: ["/app/bin/migrate"]
    environment: *app_environment
    secrets: *app_secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: postgres-password
        target: postgres-password
    restart: unless-stopped

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - source: grafana-admin-password
        target: grafana-admin-password
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  otel-collector:
    restart: unless-stopped

  tempo:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  loki:
    restart: unless-stopped

  alloy:
    restart: unless-stopped

secrets:
  database-url:
    file: ${DATABASE_URL_FILE:?set DATABASE_URL_FILE}
  secret-key-base:
    file: ${SECRET_KEY_BASE_FILE:?set SECRET_KEY_BASE_FILE}
  live-view-signing-salt:
    file: ${LIVE_VIEW_SIGNING_SALT_FILE:?set LIVE_VIEW_SIGNING_SALT_FILE}
  postgres-password:
    file: ${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE}
  postgres-exporter-password:
    file: ${POSTGRES_EXPORTER_PASSWORD_FILE:?set POSTGRES_EXPORTER_PASSWORD_FILE}
  grafana-admin-password:
    file: ${GRAFANA_PASSWORD_FILE:?set GRAFANA_PASSWORD_FILE}
