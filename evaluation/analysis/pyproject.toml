[project]
name = "network-defense-analysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["scipy==1.14.1", "matplotlib==3.9.2", "numpy==2.1.2", "starlette==1.3.1", "uvicorn==0.34.0"]

[dependency-groups]
dev = ["httpx==0.28.1"]

[project.scripts]
network-defense-analysis = "network_defense_analysis.cli:main"
network-defense-analysis-server = "network_defense_analysis.service:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
