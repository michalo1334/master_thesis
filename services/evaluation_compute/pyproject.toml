[project]
name = "evaluation-compute"
version = "0.1.0"
description = "Stateless corrected crossed-bootstrap service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.119.0",
  "numpy==2.3.4",
  "pydantic==2.12.3",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.14.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_compute"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
