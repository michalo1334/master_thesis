# Prometheus configuration for the attack-graph thesis.
# Scrapes the OTel Collector's Prometheus exporter for app metrics.
# Retention: 7 days (set by the Terraform container command).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: network_defense

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: collector

  - job_name: network_defense
    static_configs:
      - targets: ["app-0:4001", "app-1:4001"]
        labels:
          component: app

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: self
